name: Chrome

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Chrome profile directory
        run: mkdir -p "${{ runner.temp }}/chrome-config"

      - name: Restore Chrome profile
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/chrome-config
          key: chrome-profile-${{ github.actor_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chrome-profile-${{ github.actor_id }}-

      - name: Start Docker
        background: true
        run: |
          docker run -d \
            --network host \
            -v "${{ runner.temp }}/chrome-config:/config" \
            --add-host x:127.0.0.1 \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -e CHROME_CLI=https://duckduckgo.com/ \
            ghcr.io/linuxserver/chrome

      - name: Desktop URL https://<random-subdomain>.trycloudflare.com / Stop with curl x or x/ in Address Bar
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1
          echo "<?php passthru('pkill cloudflared');" > index.php
          sudo nohup php -S 0.0.0.0:80 2>/dev/null &
          cloudflared tunnel --url http://localhost:3000

      - name: Save Chrome profile
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/chrome-config
          key: chrome-profile-${{ github.actor_id }}-${{ github.run_id }}-${{ github.run_attempt }}
