name: Windows Desktop Password

on:
  workflow_dispatch:
    inputs:
      password:
        description: VNC password (1-8 ASCII letters or numbers)
        required: true
        default: password

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start password-protected Windows desktop
        uses: ./.github/actions/windows-desktop
        with:
          password: ${{ inputs.password }}
