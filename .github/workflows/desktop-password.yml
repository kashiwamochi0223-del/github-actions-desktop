name: Desktop Password

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password ( username: abc )'
        required: true
        default: password

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: 'Start Docker ( username: abc )'
        background: true
        run: |
          docker run -d \
            --network host \
            --add-host x:127.0.0.1 \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -e PASSWORD=${{ inputs.password }} \
            -e CUSTOM_PORT=8090 \
            -e CUSTOM_HTTPS_PORT=8091 \
            ghcr.io/linuxserver/webtop

      - name: Desktop URL https://<random-subdomain>.trycloudflare.com / Stop with curl x or x/ in Address Bar
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1
          echo "<?php passthru('pkill cloudflared');" > index.php
          sudo nohup php -S 0.0.0.0:80 2>/dev/null &
          cloudflared tunnel --url http://localhost:8090
